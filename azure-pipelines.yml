trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  imageName: 'itech0306/azure-devops-app'

stages:

- stage: Build
  jobs:
  - job: BuildAndPush
    steps:
    - task: Docker@2
      inputs:
        containerRegistry: 'dockerhub-service'
        repository: 'itech0306/azure-devops-app'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: latest

- stage: Deploy
  jobs:
  - job: DeployToK8s
    steps:
    - task: KubernetesManifest@1
      inputs:
        action: deploy
        kubernetesServiceConnection: 'ec2-k8s-connection'
        manifests: |
          deployment.yaml
          service.yaml
